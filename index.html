<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171525"><title>Sick or Shift? 🎲</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#39305b,#171525 60%);color:#fff}.game{width:min(100%,480px);padding:32px 24px;border:1px solid #ffffff30;border-radius:26px;background:#ffffff0b;box-shadow:0 30px 70px #0005;text-align:center}h1{font-size:clamp(2rem,8vw,3rem);margin:0 0 8px}.sub{color:#c8c1da;margin:0 0 30px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{padding:18px 8px;border:1px solid #ffffff2a;border-radius:16px;background:#ffffff0c}.choice .emoji{font-size:2rem}.choice strong{display:block;margin-top:5px}.choice small{color:#bcb5cd}.die{font-size:108px;line-height:1.2;min-height:140px;margin:24px 0 8px;display:grid;place-items:center}.rolling{animation:shake .12s infinite alternate}@keyframes shake{from{transform:translate(-6px,-4px) rotate(-12deg)}to{transform:translate(6px,4px) rotate(12deg)}}#result{min-height:85px;display:grid;align-content:center;gap:7px}#result strong{font-size:1.55rem}#result span{color:#c8c1da}button{width:100%;margin-top:16px;background:#a78bfa;color:#191329;font-weight:800;font-size:1.15rem;padding:17px;border:0;border-radius:15px;cursor:pointer}button:hover{background:#c4b5fd}button:disabled{opacity:.6;cursor:wait}footer{margin-top:23px;font-size:.8rem;color:#a9a1be}</style></head>
<body><main class="game"><h1>🎲 Sick or Shift?</h1><p class="sub">One roll. Two fates. Work or duvet?</p><div class="choices"><div class="choice"><div class="emoji">💼</div><strong>Go to work</strong><small>Even · 2, 4, 6</small></div><div class="choice"><div class="emoji">🛌</div><strong>Call in sick</strong><small>Odd · 1, 3, 5</small></div></div><div class="die" id="die" aria-label="Dice">🎲</div><div id="result" role="status" aria-live="polite"><strong>Your fate awaits…</strong><span>It's a 50/50 roll.</span></div><button id="roll">🎲 Roll the dice!</button><footer>Just for fun — actual sick days should be based on your health.</footer></main>
<script>const faces=["⚀","⚁","⚂","⚃","⚄","⚅"],die=document.getElementById("die"),result=document.getElementById("result"),button=document.getElementById("roll");button.addEventListener("click",()=>{button.disabled=true;die.classList.add("rolling");result.innerHTML="<strong>Rolling…</strong>";let ticks=0;const animation=setInterval(()=>{die.textContent=faces[Math.floor(Math.random()*6)];if(++ticks>=12){clearInterval(animation);const value=Math.floor(Math.random()*6)+1;die.textContent=faces[value-1];die.classList.remove("rolling");const work=value%2===0;result.innerHTML="<strong>"+(work?"💼 GO TO WORK!":"🛌 CALL IN SICK!")+"</strong><span>You rolled "+value+". "+(work?"Time to earn that paycheck! ☕":"Pajamas and recovery mode! 🍵")+"</span>";button.disabled=false;button.textContent="🎲 Roll again";}},75)});</script></body></html>
